    <h2><span id="payAmount"></span> C 결제</h2>
    <p class="tiny">결제를 진행하려면 확인을 눌러주세요. 취소하거나 바깥 영역을 누르면 결제되지 않습니다.</p>
    <div class="grid2">
      <button id="cancelPay" class="btn block" type="button">취소</button>
      <button id="confirmPay" class="btn primary block" type="button">결제 확인</button>
    </div>
  </div>
</div>
