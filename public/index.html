<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZIP! MARKET</title><style>
@import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');:root{--ink:#102039;--blue:#dff3ff;--yellow:#ffd268;--coral:#f36b62;--cream:#fffaf1;--line:#142033}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Pretendard,sans-serif}.app{max-width:820px;margin:auto;padding:14px 12px 95px}h1,h2,h3,.brand,.nav button{font-family:Jua,sans-serif}.top{position:sticky;top:0;z-index:10;background:#fffaf1ed;border-bottom:2px solid var(--line);padding:10px 14px;display:flex;justify-content:space-between}.brand{font-size:24px}.brand b{color:#1599df}.card{background:#fff;border:2px solid var(--line);border-radius:20px;box-shadow:0 8px 22px #10203916}.view{display:none}.view.on{display:block}.login{max-width:580px;margin:auto;overflow:hidden}.login img{width:100%;max-height:245px;object-fit:contain}.pad{padding:17px}.field{display:grid;gap:6px;margin:10px 0}.field input,.field textarea{padding:12px;border:2px solid var(--line);border-radius:12px;font:inherit}.btn{border:2px solid var(--line);border-radius:12px;padding:11px;background:#fff;font-weight:750;box-shadow:3px 3px 0 var(--line);cursor:pointer}.btn:disabled{opacity:.55;cursor:wait}.block{width:100%}.primary{background:#bfe6f8}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}.balance,.scan{padding:17px}.balance{background:#ffe59f}.scan{background:#eaf7fc}.amount{font:42px Jua}.paygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.pay{padding:0;overflow:hidden}.pay img{width:100%;height:120px;object-fit:cover}.pay b{display:block;padding:8px;font:23px Jua}.list,.games{display:grid;gap:8px}.row{padding:11px;border:1px solid var(--line);border-radius:12px;background:#fff;display:flex;justify-content:space-between}.game{display:grid;grid-template-columns:140px 1fr;gap:12px;padding:10px}.game img,.art{width:100%;height:100px;object-fit:cover;border-radius:12px}.art{display:grid;place-items:center;background:var(--blue);font:28px Jua}.done{opacity:.42}.nav{display:none;position:fixed;bottom:10px;left:50%;transform:translateX(-50%);width:min(94%,600px);background:#fff;border:2px solid var(--line);border-radius:16px;padding:6px}.nav.show{display:flex}.nav button{flex:1;border:0;background:none;padding:10px}.nav .active{background:var(--blue);border-radius:10px}.modal{display:none;position:fixed;inset:0;background:#081426b8;z-index:30;align-items:flex-end;justify-content:center}.modal.open{display:flex}.sheet{width:min(100%,620px);background:var(--cream);border-radius:24px 24px 0 0;padding:16px;max-height:92vh;overflow:auto}.reader{min-height:260px;background:white;border-radius:16px;overflow:hidden}.scan-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.tiny{font-size:11px;color:#687387}.toast{display:none;position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 15px;border-radius:999px;z-index:50}.toast.show{display:block}.spinner{display:inline-block;width:14px;height:14px;border:2px solid #789;border-top-color:transparent;border-radius:50%;animation:s .7s linear infinite}@keyframes s{to{transform:rotate(360deg)}}.admin-link{display:block;margin:12px auto 0;border:0;background:none;color:#687387;text-decoration:underline;font:600 12px Pretendard}.admin-grid,.qr-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.people{max-height:360px;overflow:auto;display:grid;gap:7px}.admin-row{display:grid;grid-template-columns:1.3fr .7fr auto;gap:8px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;background:#fff}.search-row{display:flex;gap:7px}.search-row input{flex:1}.qrbox{text-align:center}.qrbox img{width:170px;max-width:100%;border:6px solid #fff;outline:1px solid var(--line)}.admin-section{margin-top:16px}.danger{color:#9c2d26}@media(max-width:620px){.admin-grid,.qr-grid{grid-template-columns:1fr}{.pay img{height:85px}.game{grid-template-columns:105px 1fr}}@media(max-width:390px){.grid2{grid-template-columns:1fr}}
</style></head><body><header class="top"><div class="brand"><b>ZIP!</b> MARKET</div><button id="logout" class="btn" hidden>로그아웃</button></header><main class="app"><div id="toast" class="toast"></div>
<section id="login" class="view on"><div class="card login"><img src="/assets/logo.webp"><div class="pad"><h1>UNZIP YOUR GOODS</h1><div class="field"><input id="emp" placeholder="사번"><input id="pw" type="password" placeholder="비밀번호"></div><button id="loginBtn" class="btn primary block">ZIP 마켓 입장</button><button id="adminLink" class="admin-link" type="button">관리자 로그인</button></div></div></section>
<section id="pay" class="view"><div class="grid2"><div class="card balance"><span class="tiny">남은 크레딧</span><div class="amount"><span id="balance">0</span> C</div><b>사용 <span id="spent">0</span> C</b></div><div class="card scan"><h2>제품 QR 결제</h2><button id="payScan" class="btn block">QR 스캔</button></div></div><h2>크레딧 결제</h2><div class="paygrid"><button class="card pay" data-pay="100"><img src="/assets/pay-100.webp"><b>100 C</b></button><button class="card pay" data-pay="200"><img src="/assets/pay-200.webp"><b>200 C</b></button><button class="card pay" data-pay="300"><img src="/assets/pay-300.webp"><b>300 C</b></button></div><h2>사용 내역</h2><div id="tx" class="list"></div></section>
<section id="game" class="view"><div class="card pad"><h2>게임 완료 QR</h2><button id="gameScan" class="btn">QR 스캔</button></div><h2>ZIP! GAME</h2><div id="games" class="games"></div></section>
<section id="admin" class="view"><div class="card pad"><h1>관리자 페이지</h1><div class="admin-grid"><div><h2>참가자 등록</h2><div class="field"><input id="aemp" placeholder="사번"><input id="aname" placeholder="이름"><input id="apw" value="1234" placeholder="초기 비밀번호"><input id="acredit" type="number" value="1000" placeholder="초기 크레딧"></div><button id="addUser" class="btn block">참가자 등록</button></div><div><h2>엑셀 일괄 등록</h2><textarea id="bulk" rows="7" placeholder="사번[TAB]이름[TAB]비밀번호[TAB]크레딧"></textarea><button id="bulkBtn" class="btn block">일괄 등록</button></div></div><div class="admin-section"><h2>참가자 목록</h2><div class="search-row field"><input id="personSearch" placeholder="이름 또는 사번 검색"><button id="searchClear" class="btn">초기화</button></div><div id="personCount" class="tiny"></div><div id="people" class="people"></div></div><div class="admin-section"><h2>관리자 비밀번호 변경</h2><div class="field"><input id="curAdmin" type="password" placeholder="현재 비밀번호"><input id="newAdmin" type="password" placeholder="새 비밀번호 4자 이상"><input id="newAdmin2" type="password" placeholder="새 비밀번호 확인"></div><button id="changeAdmin" class="btn">비밀번호 변경</button></div><div class="admin-section"><h2>QR 코드 및 게임 관리</h2><div class="qr-grid"><div class="card pad"><h3>금액 결제 QR</h3><div class="field"><input id="qrAmount" type="number" value="400" min="1"></div><button id="makePayQr" class="btn block">결제 QR 만들기</button><div id="payQr" class="qrbox"></div></div><div class="card pad"><h3>게임 추가</h3><div class="field"><input id="gameName" placeholder="게임명"><input id="gameReward" type="number" value="100"><input id="gameImage" placeholder="이미지 URL (선택)"></div><button id="addGame" class="btn block">게임 추가 + QR 생성</button></div></div><h3>게임 완료 QR</h3><div id="gameQrs" class="qr-grid"></div></div></div></section></main><nav id="nav" class="nav"><button class="active" data-view="pay">결제</button><button data-view="game">GAME</button></nav>
<div id="adminModal" class="modal"><div class="sheet"><button class="btn close">닫기</button><h2>관리자 로그인</h2><div class="field"><input id="adminPw" type="password" placeholder="관리자 비밀번호"></div><button id="adminGo" class="btn primary block">관리자 페이지 열기</button></div></div><div id="scanModal" class="modal"><div class="sheet"><button class="btn close">닫기</button><h2 id="scanTitle">QR 스캔</h2><div id="reader" class="reader"></div><div class="scan-actions"><button id="startCamera" class="btn">카메라 시작</button><button id="chooseImage" class="btn">사진에서 읽기</button></div><input id="qrFile" type="file" accept="image/*" hidden><p class="tiny">아이폰에서는 카메라 또는 저장된 QR 사진을 사용할 수 있습니다.</p></div></div><div id="payModal" class="modal"><div class="sheet"><h2><span id="payAmt"></span> C 결제</h2><button id="confirmPay" class="btn primary block">확인</button></div></div>
<script src="/app.js"></script></body></html>
