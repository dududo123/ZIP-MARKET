<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZIP! MARKET</title><style>@import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');:root{--i:#102039;--b:#dff3ff;--y:#ffd268;--c:#fffaf1;--l:#142033}*{box-sizing:border-box}body{margin:0;background:var(--c);color:var(--i);font-family:Pretendard}.top{position:sticky;top:0;z-index:5;padding:10px 14px;border-bottom:2px solid var(--l);background:#fffaf1ee;display:flex;justify-content:space-between}.brand,h1,h2,h3,.nav button{font-family:Jua}.brand{font-size:24px}.brand b{color:#1599df}.app{max-width:840px;margin:auto;padding:14px 12px 95px}.view{display:none}.on{display:block}.card{background:#fff;border:2px solid var(--l);border-radius:20px;box-shadow:0 8px 22px #10203916}.pad{padding:16px}.login{max-width:580px;margin:auto;overflow:hidden}.login img{width:100%;max-height:245px;object-fit:contain}.field{display:grid;gap:6px;margin:10px 0}.field input,.field textarea{padding:12px;border:2px solid var(--l);border-radius:12px;font:inherit;width:100%}.btn{border:2px solid var(--l);border-radius:12px;padding:10px;background:#fff;font-weight:750;box-shadow:3px 3px 0 var(--l);cursor:pointer}.btn:disabled{opacity:.55}.block{width:100%}.primary{background:#bfe6f8}.link{display:block;margin:12px auto 0;border:0;background:none;text-decoration:underline;color:#687387}.grid2,.admin-grid,.qr-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.balance,.scan{padding:16px}.balance{background:#ffe59f}.scan{background:#eaf7fc}.amount{font:42px Jua}.paygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.pay{padding:0;overflow:hidden}.pay img{width:100%;height:115px;object-fit:cover}.pay b{display:block;padding:8px;font:22px Jua}.list,.games{display:grid;gap:8px}.row{padding:10px;border:1px solid var(--l);border-radius:12px;background:#fff;display:flex;justify-content:space-between;align-items:center}.game{display:grid;grid-template-columns:140px 1fr;gap:12px;padding:10px}.game img{width:100%;height:100px;object-fit:cover;border-radius:12px}.done{opacity:.42}.people{max-height:360px;overflow:auto;display:grid;gap:7px}.person{display:grid;grid-template-columns:1.2fr .7fr auto auto;gap:6px;align-items:center;padding:9px;border:1px solid var(--l);border-radius:11px;background:#fff}.danger{color:#a52f29;border-color:#a52f29}.qr{text-align:center}.qr img{width:160px;max-width:100%}.nav{display:none;position:fixed;bottom:10px;left:50%;transform:translateX(-50%);width:min(94%,600px);background:#fff;border:2px solid var(--l);border-radius:16px;padding:6px}.nav.show{display:flex}.nav button{flex:1;border:0;background:none;padding:10px}.nav .active{background:var(--b);border-radius:10px}.modal{display:none;position:fixed;inset:0;background:#081426b8;z-index:20;align-items:flex-end;justify-content:center}.modal.open{display:flex}.sheet{width:min(100%,620px);background:var(--c);border-radius:24px 24px 0 0;padding:16px;max-height:92vh;overflow:auto}.reader{min-height:250px;background:#fff}.toast{display:none;position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--i);color:#fff;padding:10px 15px;border-radius:999px;z-index:30}.toast.show{display:block}.tiny{font-size:11px;color:#687387}@media(max-width:620px){.admin-grid,.qr-grid{grid-template-columns:1fr}.game{grid-template-columns:105px 1fr}.pay img{height:84px}.person{grid-template-columns:1fr auto auto}}@media(max-width:390px){.grid2{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="brand"><b>ZIP!</b> MARKET</div><button id="logout" class="btn" hidden>로그아웃</button></header><main class="app"><div id="toast" class="toast"></div>
<section id="login" class="view on"><div class="card login"><img src="/assets/logo.webp"><div class="pad"><h1>UNZIP YOUR GOODS</h1><div class="field"><input id="emp" placeholder="사번"><input id="pw" type="password" placeholder="비밀번호"></div><button id="loginBtn" class="btn primary block">ZIP 마켓 입장</button><button id="adminLink" class="link">관리자 로그인</button></div></div></section>
<section id="pay" class="view"><div class="grid2"><div class="card balance"><span class="tiny">남은 크레딧</span><div class="amount"><span id="balance">0</span> C</div><b>사용 <span id="spent">0</span> C</b></div><div class="card scan"><h2>제품 QR 결제</h2><button id="payScan" class="btn block">QR 스캔</button></div></div><h2>크레딧 결제</h2><div class="paygrid"><button class="card pay" data-pay="100"><img src="/assets/pay-100.webp"><b>100 C</b></button><button class="card pay" data-pay="200"><img src="/assets/pay-200.webp"><b>200 C</b></button><button class="card pay" data-pay="300"><img src="/assets/pay-300.webp"><b>300 C</b></button></div><h2>사용 내역</h2><div id="tx" class="list"></div></section>
<section id="game" class="view"><div class="card pad"><h2>게임 완료 QR</h2><button id="gameScan" class="btn">QR 스캔</button></div><h2>ZIP! GAME</h2><div id="games" class="games"></div></section>
<section id="admin" class="view"><div class="card pad"><h1>관리자 페이지</h1><div class="admin-grid"><div><h2>참가자 등록</h2><div class="field"><input id="aemp" placeholder="사번"><input id="aname" placeholder="이름"><input id="apw" value="1234"><input id="acredit" type="number" value="1000"></div><button id="addUser" class="btn block">등록</button></div><div><h2>엑셀 일괄 등록</h2><textarea id="bulk" rows="7" placeholder="사번[TAB]이름[TAB]비밀번호[TAB]크레딧"></textarea><button id="bulkBtn" class="btn block">일괄 등록</button></div></div><h2>참가자 목록</h2><div class="field"><div class="grid2"><input id="search" placeholder="이름 또는 사번 검색"><button id="resetSearch" class="btn">초기화</button></div></div><div id="count" class="tiny"></div><div id="people" class="people"></div><h2>관리자 비밀번호</h2><div class="field"><input id="cur" type="password" placeholder="현재 비밀번호"><input id="next" type="password" placeholder="새 비밀번호"><input id="next2" type="password" placeholder="새 비밀번호 확인"></div><button id="changePw" class="btn">변경</button><h2>QR 및 게임 관리</h2><div class="qr-grid"><div class="card pad"><h3>결제 QR</h3><input id="qrAmount" type="number" value="400"><button id="makeQr" class="btn">만들기</button><div id="payQr" class="qr"></div></div><div class="card pad"><h3>게임 추가</h3><div class="field"><input id="gname" placeholder="게임명"><input id="greward" type="number" value="100"><input id="gimage" placeholder="이미지 URL (선택)"></div><button id="addGame" class="btn">게임 추가</button><p class="tiny">이미지를 비우면 ORAC 기본 GAME 이미지가 사용됩니다.</p></div></div><h3>게임 완료 QR</h3><div id="gameQrs" class="qr-grid"></div></div></section>
</main><nav id="nav" class="nav"><button class="active" data-view="pay">결제</button><button data-view="game">GAME</button></nav>
<div id="adminModal" class="modal"><div class="sheet"><button class="btn close">닫기</button><h2>관리자 로그인</h2><input id="adminPw" type="password"><button id="adminGo" class="btn primary block">로그인</button></div></div><div id="scanModal" class="modal"><div class="sheet"><button class="btn close">닫기</button><h2 id="scanTitle">QR 스캔</h2><div id="reader" class="reader"></div><button id="startCamera" class="btn">카메라 시작</button><button id="chooseImage" class="btn">사진에서 읽기</button><input id="qrFile" type="file" accept="image/*" hidden></div></div><div id="payModal" class="modal"><div class="sheet"><h2><span id="payAmount"></span> C 결제</h2><button id="confirmPay" class="btn primary block">확인</button></div></div><script src="/app.js"></script></body></html>
