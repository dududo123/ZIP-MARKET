<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fffaf2">
  <meta name="description" content="ZIP! MARKET 크레딧 결제와 게임 참여 서비스">
  <link rel="preload" href="/assets/zip-market-logo.webp" as="image" type="image/webp">
  <link rel="stylesheet" href="/styles.min.css?v=__BUILD_VERSION__">
  <title>ZIP! MARKET</title>
</head>
<body>
  <header class="site-header">
    <button id="brandBtn" class="brand" type="button" aria-label="ZIP! MARKET 홈">ZIP! <strong>MARKET</strong></button>
    <div id="sessionActions" class="session-actions hidden">
      <span id="sessionName"></span><button id="logoutBtn" class="text-button" type="button">로그아웃</button>
    </div>
  </header>

  <main id="app" tabindex="-1">
    <section id="loginView" class="view login-view" aria-labelledby="loginTitle">
      <div class="login-card paper-card">
        <img class="main-logo" src="/assets/zip-market-logo.webp" width="340" height="231" alt="ZIP! MARKET — UNZIP YOUR GOODS">
        <h1 id="loginTitle">UNZIP YOUR GOODS</h1>
        <form id="userLoginForm" class="stack-form">
          <label class="sr-only" for="employeeNo">사번</label>
          <input id="employeeNo" name="employeeNo" autocomplete="username" inputmode="numeric" placeholder="사번" required>
          <label class="sr-only" for="userPassword">비밀번호</label>
          <input id="userPassword" name="password" type="password" autocomplete="current-password" placeholder="비밀번호" required>
          <button class="primary-button" type="submit">ZIP 마켓 입장</button>
        </form>
        <button id="openAdminLoginBtn" class="text-button admin-entry" type="button">관리자 로그인</button>
      </div>
    </section>

    <section id="userView" class="view hidden" aria-label="사용자 페이지">
      <div class="page-shell">
        <section class="hero-panel">
          <div><p class="eyebrow">ZIP! MARKET</p><h1><span id="userName"></span>님, 반가워요!</h1><p id="userEmployee" class="muted"></p></div>
          <div class="credit-badge"><span>사용 가능 크레딧</span><strong id="creditBalance">0 C</strong></div>
        </section>
        <nav class="user-tabs" aria-label="사용자 메뉴">
          <button type="button" data-route="user-pay" aria-selected="true">크레딧 결제</button>
          <button type="button" data-route="user-games" aria-selected="false">GAME</button>
        </nav>

        <section id="payPanel" class="tab-panel">
          <button id="openPaymentBtn" class="feature-card" type="button">
            <span class="feature-image"><img src="/assets/credit-pay.webp" alt="크레딧 결제" width="1200" height="750"></span>
            <span class="feature-copy"><strong>크레딧 결제</strong><small>관리자가 보여주는 QR 코드를 스캔하세요</small></span>
            <span aria-hidden="true">→</span>
          </button>
          <section class="paper-card history-card" aria-labelledby="historyTitle">
            <div class="section-heading"><div><p class="eyebrow">HISTORY</p><h2 id="historyTitle">사용 내역</h2></div><span id="transactionCount" class="count-pill">0건</span></div>
            <div id="transactionList" class="transaction-list"></div>
            <button id="toggleTransactionsBtn" class="history-toggle hidden" type="button" aria-expanded="false">
              <span>나머지 내역도 보기</span><span class="chevron" aria-hidden="true">⌄</span>
            </button>
          </section>
        </section>

        <section id="gamesPanel" class="tab-panel hidden" aria-labelledby="gamesTitle">
          <div class="section-heading"><div><p class="eyebrow">PLAY &amp; ENJOY</p><h2 id="gamesTitle">GAME</h2></div><span id="gameProgress" class="count-pill"></span></div>
          <div id="gameGrid" class="game-grid"></div>
        </section>
      </div>
    </section>

    <section id="adminView" class="view hidden" aria-label="관리자 페이지">
      <div class="page-shell admin-shell">
        <div class="section-heading admin-title"><div><p class="eyebrow">ZIP! MARKET OPERATOR</p><h1>관리자 페이지</h1></div><button id="refreshAdminBtn" class="secondary-button" type="button">새로고침</button></div>
        <div class="admin-grid">
          <section class="paper-card admin-card">
            <h2>참가자 등록</h2>
            <form id="participantForm" class="stack-form compact-form">
              <input name="employeeNo" placeholder="사번" required><input name="name" placeholder="이름" required><input name="password" type="password" placeholder="초기 비밀번호" required><button class="primary-button" type="submit">참가자 추가</button>
            </form>
            <details><summary>Excel에서 여러 명 붙여넣기</summary><p class="help">사번, 이름, 비밀번호를 탭으로 구분해 한 줄에 한 명씩 붙여넣으세요.</p><textarea id="bulkParticipants" rows="6" placeholder="20240001\t김지퍼\t1234"></textarea><button id="bulkAddBtn" class="secondary-button full" type="button">일괄 등록</button></details>
          </section>
          <section class="paper-card admin-card">
            <h2>결제 QR 만들기</h2>
            <form id="paymentQrForm" class="stack-form compact-form"><input name="amount" type="number" min="1" step="1" inputmode="numeric" placeholder="결제 금액 (C)" required><input name="description" placeholder="결제 내용 (선택)"><button class="primary-button" type="submit">결제 QR 생성</button></form>
          </section>
          <section class="paper-card admin-card">
            <h2>새 게임 추가</h2>
            <form id="gameForm" class="stack-form compact-form"><input name="name" placeholder="게임 이름" required><input name="imageUrl" placeholder="이미지 URL (비우면 기본 이미지)"><button class="primary-button" type="submit">게임 추가</button></form>
          </section>
          <section class="paper-card admin-card">
            <h2>관리자 비밀번호 변경</h2>
            <form id="adminPasswordForm" class="stack-form compact-form"><input name="password" type="password" minlength="8" placeholder="새 비밀번호 (8자 이상)" required><button class="secondary-button" type="submit">비밀번호 변경</button></form>
          </section>
        </div>

        <section class="paper-card admin-list-card">
          <div class="section-heading"><div><p class="eyebrow">PARTICIPANTS</p><h2>참가자 관리</h2></div><span id="participantCount" class="count-pill">0명</span></div>
          <div class="search-row"><input id="participantSearch" type="search" placeholder="사번 또는 이름 검색"><button id="resetSearchBtn" class="secondary-button" type="button">초기화</button></div>
          <div id="participantList" class="admin-list"></div>
        </section>
        <section class="paper-card admin-list-card">
          <div class="section-heading"><div><p class="eyebrow">GAMES</p><h2>게임 QR · 삭제</h2></div><span id="adminGameCount" class="count-pill">0개</span></div>
          <div id="adminGameList" class="admin-list game-admin-list"></div>
        </section>
      </div>
    </section>
  </main>

  <div id="modalRoot" class="modal-root hidden" aria-hidden="true">
    <div class="modal-backdrop" data-modal-close></div>
    <section id="modalPanel" class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button id="modalCloseBtn" class="modal-close" type="button" aria-label="팝업 닫기">×</button>
      <div id="modalContent"></div>
    </section>
  </div>
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  <script src="/app.min.js?v=__BUILD_VERSION__" defer></script>
</body>
</html>
