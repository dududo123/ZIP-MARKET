<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZIP! MARKET</title><style>
@import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');:root{--ink:#102039;--blue:#dff3ff;--yellow:#ffd268;--coral:#f36b62;--cream:#fffaf1;--line:#142033}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Pretendard,sans-serif}.app{max-width:820px;margin:auto;padding:14px 12px 90px}h1,h2,h3,.brand,.nav button{font-family:Jua,sans-serif}.card{background:#fff;border:2px solid var(--line);border-radius:20px;box-shadow:0 8px 22px #10203916}.top{position:sticky;top:0;z-index:10;background:#fffaf1ee;border-bottom:2px solid var(--line);padding:10px 14px;display:flex;justify-content:space-between}.brand{font-size:24px}.brand b{color:#1599df}.view{display:none}.view.on{display:block}.login{max-width:580px;margin:auto;overflow:hidden}.login img{width:100%;max-height:260px;object-fit:contain}.pad{padding:17px}.field{display:grid;gap:5px;margin:10px 0}.field input,.field textarea{padding:12px;border:2px solid var(--line);border-radius:12px;font:inherit}.btn{border:2px solid var(--line);border-radius:12px;padding:11px;background:#fff;font-weight:750;box-shadow:3px 3px 0 var(--line);cursor:pointer}.block{width:100%}.primary{background:#bfe6f8}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}.balance,.scan{padding:17px}.balance{background:#ffe59f}.amount{font:42px Jua}.scan{background:#eaf7fc}.paygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.pay{padding:0;overflow:hidden}.pay img{width:100%;height:125px;object-fit:cover}.pay b{display:block;padding:8px;font:23px Jua}.list{display:grid;gap:8px}.row{padding:11px;border:1px solid var(--line);border-radius:12px;background:white;display:flex;justify-content:space-between;align-items:center}.games{display:grid;gap:10px}.game{display:grid;grid-template-columns:140px 1fr;gap:12px;padding:10px}.game img,.art{width:100%;height:100px;object-fit:cover;border-radius:12px}.art{display:grid;place-items:center;background:var(--blue);font:28px Jua}.done{opacity:.42}.nav{display:none;position:fixed;bottom:10px;left:50%;transform:translateX(-50%);width:min(94%,600px);background:#fff;border:2px solid var(--line);border-radius:16px;padding:6px}.nav.show{display:flex}.nav button{flex:1;border:0;background:none;padding:10px}.nav .active{background:var(--blue);border-radius:10px}.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.people{max-height:360px;overflow:auto}.modal{display:none;position:fixed;inset:0;background:#081426b8;z-index:30;align-items:flex-end;justify-content:center}.modal.open{display:flex}.sheet{width:min(100%,620px);background:var(--cream);border-radius:24px 24px 0 0;padding:16px;max-height:90vh;overflow:auto}.camera{height:270px;background:#102039;border-radius:16px;overflow:hidden}.camera video{width:100%;height:100%;object-fit:cover}.tiny{font-size:11px;color:#687387}.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 15px;border-radius:999px;display:none;z-index:50}.toast.show{display:block}@media(max-width:620px){.admin-grid{grid-template-columns:1fr}.pay img{height:85px}.game{grid-template-columns:105px 1fr}.grid2{grid-template-columns:1fr 1fr}}@media(max-width:390px){.grid2{grid-template-columns:1fr}}
</style></head><body><header class="top"><div class="brand"><b>ZIP!</b> MARKET</div><button id="logout" class="btn" hidden>로그아웃</button></header><main class="app"><div id="toast" class="toast"></div>
<section id="login" class="view on"><div class="card login"><img src="/assets/logo.webp"><div class="pad"><h1>UNZIP YOUR GOODS</h1><div class="field"><input id="emp" placeholder="사번"><input id="pw" type="password" placeholder="비밀번호"></div><button id="loginBtn" class="btn primary block">ZIP 마켓 입장</button><button id="adminLink" class="btn block" style="margin-top:9px">관리자 로그인</button></div></div></section>
<section id="pay" class="view"><div class="grid2"><div class="card balance"><span class="tiny">남은 크레딧</span><div class="amount"><span id="balance">0</span> C</div><b>사용 <span id="spent">0</span> C</b></div><div class="card scan"><h2>제품 QR 결제</h2><button id="payScan" class="btn block">카메라 열기</button></div></div><h2>크레딧 결제</h2><div class="paygrid"><button class="card pay" data-pay="100"><img src="/assets/pay-100.webp"><b>100 C</b></button><button class="card pay" data-pay="200"><img src="/assets/pay-200.webp"><b>200 C</b></button><button class="card pay" data-pay="300"><img src="/assets/pay-300.webp"><b>300 C</b></button></div><p class="card pad">300 C 이상 금액 품목은 QR코드 결제를 활용해주세요.</p><h2>사용 내역</h2><div id="tx" class="list"></div></section>
<section id="game" class="view"><div class="card pad"><h2>게임 완료 QR 스캔</h2><button id="gameScan" class="btn">QR 스캔</button></div><h2>ZIP! GAME</h2><div id="games" class="games"></div></section>
<section id="admin" class="view"><div class="admin-grid"><div class="card pad"><h2>참가자 등록</h2><div class="field"><input id="aemp" placeholder="사번"><input id="aname" placeholder="이름"><input id="apw" value="1234"><input id="acredit" type="number" value="1000"></div><button id="addUser" class="btn block">등록</button><textarea id="bulk" rows="6" placeholder="사번[TAB]이름[TAB]비밀번호[TAB]크레딧"></textarea><button id="bulkBtn" class="btn block">엑셀 일괄 등록</button></div><div class="card pad"><h2>게임 추가</h2><div class="field"><input id="gname" placeholder="게임명"><input id="greward" type="number" value="100"><input id="gimage" placeholder="이미지 URL 선택"></div><button id="addGame" class="btn block">게임 추가</button><h2>관리자 비밀번호</h2><div class="field"><input id="cur" type="password" placeholder="현재"><input id="next" type="password" placeholder="새 비밀번호"></div><button id="changePw" class="btn block">변경</button></div></div><h2>참가자 목록</h2><div class="field"><input id="search" placeholder="이름 또는 사번 검색"></div><div id="people" class="people list"></div><h2>QR 만들기</h2><div class="grid2"><div class="card pad"><input id="qrAmount" type="number" value="400"><button id="makePayQr" class="btn">결제 QR</button><div id="payQr"></div></div><div class="card pad"><div id="gameQrs"></div></div></div></section>
</main><nav id="nav" class="nav"><button class="active" data-view="pay">결제</button><button data-view="game">GAME</button></nav>
<div id="adminModal" class="modal"><div class="sheet"><h2>관리자 로그인</h2><input id="adminPw" type="password"><button id="adminGo" class="btn">로그인</button></div></div><div id="scanModal" class="modal"><div class="sheet"><button class="btn close">닫기</button><div class="camera"><video id="video" autoplay playsinline></video></div><p id="scanMsg">QR을 맞춰주세요</p></div></div><div id="payModal" class="modal"><div class="sheet"><h2><span id="payAmt"></span> C 결제</h2><button id="confirmPay" class="btn primary block">확인</button></div></div>
<script src="/app.js"></script></body></html>
