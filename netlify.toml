[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Route all ZIP! MARKET API traffic to the single api function.
# force=true prevents a static /api path or SPA fallback from winning first.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# SPA fallback must stay AFTER /api/*.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
